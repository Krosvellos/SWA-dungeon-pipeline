spring.application.name=backendTest

# MongoDB settings
spring.data.mongodb.uri=mongodb://localhost:27017/dungeondb

# SQL Database settings (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/dungeondb
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Alert recipient — override locally or via environment variable ALERT_RECIPIENT
app.alert.recipient=${ALERT_RECIPIENT:your-email@example.com}

