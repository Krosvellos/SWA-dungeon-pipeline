<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a1a00"/>
      <stop offset="100%" stop-color="#0a0500"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd100" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffd100" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer ring -->
  <circle cx="60" cy="60" r="58" fill="url(#bg)" stroke="#ffd100" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="54" fill="none" stroke="#aa7700" stroke-width="0.8"/>

  <!-- Glow -->
  <circle cx="60" cy="60" r="48" fill="url(#glow)"/>

  <!-- Top left wing -->
  <path d="M60,30 C48,22 34,24 28,34 C24,40 26,50 34,54 C30,44 36,36 46,36 C52,36 58,40 60,46" fill="none" stroke="#ffd100" stroke-width="2" stroke-linecap="round"/>
  <!-- Top right wing -->
  <path d="M60,30 C72,22 86,24 92,34 C96,40 94,50 86,54 C90,44 84,36 74,36 C68,36 62,40 60,46" fill="none" stroke="#ffd100" stroke-width="2" stroke-linecap="round"/>

  <!-- Dragon head shield shape -->
  <path d="M60,44 L68,52 L66,66 L60,72 L54,66 L52,52 Z" fill="#1a0d00" stroke="#ffd100" stroke-width="1.5"/>

  <!-- Dragon eyes -->
  <ellipse cx="56.5" cy="57" rx="2.5" ry="2" fill="#ffd100"/>
  <ellipse cx="63.5" cy="57" rx="2.5" ry="2" fill="#ffd100"/>

  <!-- Snout -->
  <path d="M57,62 L60,65 L63,62" fill="none" stroke="#ffd100" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Horns -->
  <path d="M55,52 L51,46 L54,50" fill="#ffd100"/>
  <path d="M65,52 L69,46 L66,50" fill="#ffd100"/>

  <!-- Lower decorative band -->
  <path d="M35,78 Q60,86 85,78" fill="none" stroke="#ffd100" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M42,83 Q60,90 78,83" fill="none" stroke="#aa7700" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Side ornaments -->
  <circle cx="28" cy="60" r="3" fill="#ffd100" opacity="0.7"/>
  <circle cx="92" cy="60" r="3" fill="#ffd100" opacity="0.7"/>
  <line x1="31" y1="60" x2="38" y2="60" stroke="#ffd100" stroke-width="1" opacity="0.5"/>
  <line x1="82" y1="60" x2="89" y2="60" stroke="#ffd100" stroke-width="1" opacity="0.5"/>
</svg>
